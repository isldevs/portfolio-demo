server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      max: 100
spring:
  application:
    name: personal-portfolio-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/portfolio}
    username: ${POSTGRES_USER:portfolio}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
app:
  internal-api-key: ${INTERNAL_API_KEY:}
  ip-hash-salt: ${IP_HASH_SALT:}
