name: Build and test
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run tests and build Vaadin production bundle
        run: mvn -B -ntp -Pproduction clean verify
      - name: Check executable JAR
        run: test -s target/vaadin-portfolio-1.0.0.jar
